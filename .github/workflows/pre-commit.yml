name: pre-commit

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v.7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dev dependencies
        run: npm ci --include=dev

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jpegoptim optipng

      - uses: Alfresco/alfresco-build-tools/.github/actions/pre-commit@v18.26.0
        with:
          skip_checkout: "true"
